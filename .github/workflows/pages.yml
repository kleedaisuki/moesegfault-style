name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build library
        run: pnpm build:library

      - name: Protect immutable release history
        env:
          RELEASE_BASE: ${{ github.event.before || format('{0}^', github.sha) }}
        run: pnpm release:verify-history "$RELEASE_BASE"

      - name: Build versioned static assets
        run: pnpm cdn:build

      - name: Verify versioned static assets
        run: pnpm cdn:verify

      - name: Require committed release assets
        run: |
          git diff --exit-code -- static-releases pages/public
          test -z "$(git status --porcelain --untracked-files=all -- static-releases pages/public)"

      - name: Build documentation and showcase
        run: pnpm build:pages

      - name: Test libraries and documentation
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm --filter @moesegfault/pages exec playwright install --with-deps chromium

      - name: Test documentation in a production server
        run: pnpm test:e2e

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
