name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:library

      - name: Protect immutable release history
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
        run: pnpm release:verify-history "$RELEASE_BASE"

      - name: Build and verify versioned assets
        run: pnpm cdn:build && pnpm cdn:verify

      - name: Build distributable agent skill
        run: pnpm skill:build

      - name: Require committed release assets
        run: |
          git diff --exit-code -- static-releases pages/public
          test -z "$(git status --porcelain --untracked-files=all -- static-releases pages/public)"

      - name: Build documentation and showcase
        run: pnpm build:pages

      - name: Test
        run: pnpm test

      - name: Install browser runtimes
        run: pnpm --filter @moesegfault/pages exec playwright install --with-deps chromium webkit

      - name: Run browser and visual regression tests
        run: pnpm test:e2e

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Validate Cloudflare deployment bundle
        run: pnpm exec wrangler deploy --dry-run --outdir .temp/wrangler-dry-run

      - name: Upload verified static site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cloudflare-static-site
          path: pages/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-test-evidence
          path: |
            pages/test-results
            pages/playwright-report
          if-no-files-found: ignore
          retention-days: 7
