packages:
  - packages/*
  - pages

allowBuilds:
  esbuild: true
  sharp: true
  # Wrangler 的本地运行时需要安装平台二进制。 / Wrangler local development needs its platform binary.
  workerd: true

overrides:
  # The extension only imports KaTeX in an HTML compiler we never call; share the pinned copy.
  micromark-extension-math>katex: 0.19.1
